general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = glide, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 6, glide
    animation = fadeOut, 1, 5, glide
    animation = inputFieldDots, 1, 3, glide
    animation = inputFieldColors, 1, 4, glide
}

background {
    monitor =
    path = /home/et/.cache/hypr/lock-background.png
    color = rgba(28, 27, 34, 1.0)
    blur_passes = 4
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

shape {
    monitor =
    size = 520, 470
    color = rgba(28, 27, 34, 0.55)
    rounding = 0
    border_size = 2
    border_color = rgba(229, 185, 244, 1.0) rgba(181, 176, 232, 1.0) 45deg
    position = 0, 45
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(251, 251, 254, 1.0)
    font_size = 104
    font_family = JetBrains Mono ExtraBold
    position = 0, 165
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B' | sed 's/^./\U&/')"
    color = rgba(229, 185, 244, 1.0)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = Olá, $USER
    color = rgba(251, 251, 254, 0.8)
    font_size = 17
    font_family = JetBrains Mono
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    rounding = 0
    outer_color = rgba(229, 185, 244, 1.0) rgba(181, 176, 232, 1.0) 45deg
    inner_color = rgba(28, 27, 34, 0.85)
    font_color = rgba(251, 251, 254, 1.0)
    check_color = rgba(181, 176, 232, 1.0) rgba(229, 185, 244, 1.0) 120deg
    fail_color = rgba(255, 85, 85, 1.0)
    capslock_color = rgba(255, 184, 108, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Digite a senha...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    hide_input = false
    position = 0, -55
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.45)
}

label {
    monitor =
    text = Layout: $LAYOUT
    color = rgba(251, 251, 254, 0.45)
    font_size = 13
    font_family = JetBrains Mono
    position = 0, -130
    halign = center
    valign = center
}
